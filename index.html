<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Настроение</title>
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Настроение">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#14161c; --card:#1d2029; --card2:#252935; --line:#2f3443;
  --text:#eef0f5; --muted:#8d93a5; --accent:#8b7bff; --accent2:#b3a8ff;
  --ok:#5fd39a; --r:16px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f4f8; --card:#fff; --card2:#f0f0f6; --line:#e2e3ec;
    --text:#1a1c23; --muted:#6b7083; --accent:#6a58f0; --accent2:#5747d6; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 90px)}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;margin:6px 0 14px}
header h1{flex:1;margin:0;font-size:20px;text-align:center;font-weight:650}
header h1 small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:20px;cursor:pointer}
.ib:disabled{opacity:.35}
.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden}
.slot.now{border-color:var(--accent)}
.sh{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;user-select:none}
.sh .nm{font-weight:650}
.sh .tm{color:var(--muted);font-size:13px}
.sh .sum{margin-left:auto;font-size:14px;color:var(--muted);text-align:right}
.sh .sum b{color:var(--text)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.slot.done .dot{background:var(--ok)}
.sb{display:none;padding:0 14px 14px}
.slot.open .sb{display:block}
.lbl{font-size:13px;color:var(--muted);margin:10px 0 6px;display:flex;justify-content:space-between}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{height:40px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;padding:0}
.scale button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card2);color:var(--text);
  border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
textarea{width:100%;min-height:70px;resize:vertical;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);padding:10px 12px;font:inherit;font-size:16px}
.row{display:flex;gap:8px;margin-top:10px}
.clr{margin-left:auto;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(transparent,var(--bg) 30%)}
.bar .wrap{display:flex;gap:8px}
.btn{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
dialog{border:none;border-radius:20px;background:var(--card);color:var(--text);
  width:min(520px,calc(100vw - 24px));padding:18px;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 12px;font-size:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--card2);color:var(--text);
  border-radius:10px;padding:9px 10px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dates{display:none;gap:8px;margin-top:8px}
.dates.show{display:flex}
.dates input{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);padding:0 8px;font:inherit}
.info{font-size:13px;color:var(--muted);margin:10px 0}
pre{background:var(--card2);border-radius:12px;padding:10px;font-size:12px;max-height:180px;
  overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.small{font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;padding:10px 0 0;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="ib" id="prev" aria-label="Предыдущий день">‹</button>
    <h1 id="dtitle">Сегодня<small></small></h1>
    <button class="ib" id="next" aria-label="Следующий день">›</button>
  </header>
  <div id="slots"></div>
</div>

<div class="bar"><div class="wrap">
  <button class="btn" id="todayBtn">Сегодня</button>
  <button class="btn pri" id="expBtn">Экспорт</button>
</div></div>

<dialog id="dlg">
  <h2>Экспорт истории</h2>
  <div class="seg" id="period">
    <button data-p="7" class="on">Неделя</button>
    <button data-p="30">Месяц</button>
    <button data-p="90">3 месяца</button>
    <button data-p="all">Всё</button>
    <button data-p="custom">Свои даты</button>
  </div>
  <div class="dates" id="dates">
    <input type="date" id="dFrom"><input type="date" id="dTo">
  </div>
  <div class="seg" id="fmt" style="margin-top:12px">
    <button data-f="txt" class="on">Текст для ИИ</button>
    <button data-f="json">JSON</button>
  </div>
  <p class="info" id="einfo"></p>
  <pre id="preview"></pre>
  <div class="grid2">
    <button class="btn pri" id="copyBtn">Скопировать</button>
    <button class="btn" id="saveBtn">Сохранить файл</button>
  </div>
  <div class="row">
    <button class="small" id="impBtn">Восстановить из JSON</button>
    <button class="small" style="margin-left:auto" id="closeBtn">Закрыть</button>
  </div>
  <input type="file" id="impFile" accept=".json,application/json" hidden>
</dialog>

<div class="toast" id="toast"></div>

<script>
const SLOTS = [
  {id:'s1', name:'Утро',        from:6,  to:10},
  {id:'s2', name:'День',        from:10, to:14},
  {id:'s3', name:'После обеда', from:14, to:18},
  {id:'s4', name:'Вечер',       from:18, to:22},
  {id:'s5', name:'Ночь',        from:22, to:6},
];
const EMOTIONS = ['Радость','Спокойствие','Интерес','Воодушевление','Благодарность','Уверенность',
  'Нежность','Усталость','Скука','Апатия','Тревога','Страх','Грусть','Одиночество',
  'Раздражение','Злость','Стыд','Вина','Растерянность','Обида'];
const KEY = 'mood.v1';
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

let db = load();
let open = null;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Не удалось сохранить'); } }

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const slotTime = s => `${pad(s.from)}–${pad(s.to)}`;

// Текущий отрезок; ночь после полуночи относится к предыдущему дню
function nowSlot(){
  const d = new Date(), h = d.getHours();
  if (h < 6){ d.setDate(d.getDate()-1); return {date: iso(d), id:'s5'}; }
  const s = SLOTS.find(s => s.to > s.from ? h >= s.from && h < s.to : h >= s.from);
  return {date: iso(d), id: s.id};
}
let day = nowSlot().date;

function dayTitle(s){
  const t = nowSlot().date, d = parse(s);
  const rel = s===t ? 'Сегодня' : s===addDays(t,-1) ? 'Вчера' : WD[d.getDay()].replace(/^./,c=>c.toUpperCase());
  return [rel, `${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}, ${WD[d.getDay()]}`];
}

function get(date,id){ return (db[date] && db[date][id]) || null; }
function set(date,id,patch){
  db[date] = db[date] || {};
  const cur = db[date][id] || {};
  const v = Object.assign({}, cur, patch, {updated: new Date().toISOString()});
  db[date][id] = v;
  save();
}
function clear(date,id){
  if (db[date]){ delete db[date][id]; if (!Object.keys(db[date]).length) delete db[date]; }
  save();
}
const filled = v => v && (v.mood || v.emotion || v.intensity || (v.note||'').trim());

function render(){
  const [t, sub] = dayTitle(day);
  document.getElementById('dtitle').innerHTML = `${t}<small>${sub}</small>`;
  const ns = nowSlot();
  document.getElementById('next').disabled = day >= ns.date;
  if (open === null) open = (day===ns.date) ? ns.id : null;
  const box = document.getElementById('slots');
  box.innerHTML = '';
  for (const s of SLOTS){
    const v = get(day, s.id) || {};
    const el = document.createElement('div');
    el.className = 'slot' + (filled(v)?' done':'') + (open===s.id?' open':'') + (day===ns.date && ns.id===s.id?' now':'');
    const sum = sumHtml(v, day===ns.date && ns.id===s.id);
    el.innerHTML = `
      <div class="sh"><span class="dot"></span><div><div class="nm">${s.name}</div><div class="tm">${slotTime(s)}</div></div>
        <div class="sum">${sum}</div></div>
      <div class="sb">
        <div class="lbl"><span>Настроение</span><span>1 — плохо · 10 — отлично</span></div>
        <div class="scale" data-k="mood">${scale(v.mood)}</div>
        <div class="lbl"><span>Эмоция</span></div>
        <div class="chips">${EMOTIONS.map(e=>`<button class="${v.emotion===e?'on':''}">${e}</button>`).join('')}</div>
        <div class="lbl"><span>Сила эмоции</span><span>1 — едва · 10 — накрывает</span></div>
        <div class="scale" data-k="intensity">${scale(v.intensity)}</div>
        <div class="lbl"><span>Как я себя ощущаю</span></div>
        <textarea placeholder="Пара слов: что происходит, почему так…">${esc(v.note||'')}</textarea>
        <div class="row">${filled(v)?'<button class="clr">Очистить отрезок</button>':''}</div>
      </div>`;
    el.querySelector('.sh').onclick = () => { open = open===s.id ? '' : s.id; render(); };
    el.querySelectorAll('.scale').forEach(sc => sc.querySelectorAll('button').forEach((b,i) => b.onclick = () => {
      const k = sc.dataset.k, n = i+1;
      set(day, s.id, {[k]: (get(day,s.id)||{})[k]===n ? null : n}); render();
    }));
    el.querySelectorAll('.chips button').forEach(b => b.onclick = () => {
      const e = b.textContent;
      set(day, s.id, {emotion: (get(day,s.id)||{}).emotion===e ? null : e}); render();
    });
    const ta = el.querySelector('textarea');
    ta.oninput = () => {
      set(day, s.id, {note: ta.value});
      const nv = get(day, s.id) || {};
      el.classList.toggle('done', !!filled(nv));
      el.querySelector('.sum').innerHTML = sumHtml(nv, day===ns.date && ns.id===s.id);
    };
    const c = el.querySelector('.clr');
    if (c) c.onclick = () => { if (confirm('Очистить этот отрезок?')){ clear(day, s.id); render(); } };
    box.appendChild(el);
  }
}
function sumHtml(v, isNow){
  if (!filled(v)) return isNow ? 'сейчас' : '';
  return `${v.mood?`<b>${v.mood}/10</b>`:''}${v.emotion?`${v.mood?' · ':''}${v.emotion}${v.intensity?' '+v.intensity:''}`:''}${!v.mood&&!v.emotion?'заметка':''}`;
}
function scale(val){ let h=''; for(let i=1;i<=10;i++) h+=`<button class="${val===i?'on':''}">${i}</button>`; return h; }
function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.getElementById('prev').onclick = () => { day = addDays(day,-1); open=null; render(); };
document.getElementById('next').onclick = () => { day = addDays(day,1); open=null; render(); };
document.getElementById('todayBtn').onclick = () => { day = nowSlot().date; open=null; render(); };

// ---------- Экспорт ----------
let period = '7', fmt = 'txt';
const dlg = document.getElementById('dlg');
function range(){
  const today = nowSlot().date;
  if (period==='all'){
    const keys = Object.keys(db).sort();
    return [keys[0] || today, today];
  }
  if (period==='custom'){
    const a = document.getElementById('dFrom').value || today, b = document.getElementById('dTo').value || today;
    return a<=b ? [a,b] : [b,a];
  }
  return [addDays(today, -(+period-1)), today];
}
function rows(a,b){
  const out = [];
  for (let d=a; d<=b; d=addDays(d,1)){
    const e = db[d] || {};
    out.push({date:d, weekday:WD[parse(d).getDay()], slots: SLOTS.map(s => ({s, v:e[s.id]})).filter(x=>filled(x.v))});
  }
  return out;
}
const avg = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10 : null;

function buildTxt(a,b){
  const R = rows(a,b);
  const all = R.flatMap(r=>r.slots.map(x=>x.v));
  const moods = all.map(v=>v.mood).filter(Boolean);
  const cnt = {};
  all.forEach(v=>{ if(v.emotion){ cnt[v.emotion]=cnt[v.emotion]||{n:0,sum:0,k:0}; cnt[v.emotion].n++; if(v.intensity){cnt[v.emotion].sum+=v.intensity;cnt[v.emotion].k++;} } });
  const top = Object.entries(cnt).sort((x,y)=>y[1].n-x[1].n)
    .map(([e,c])=>`${e} ×${c.n}${c.k?` (ср. сила ${avg([c.sum/c.k])})`:''}`);
  const bySlot = SLOTS.map(s=>{ const m = R.flatMap(r=>r.slots.filter(x=>x.s.id===s.id).map(x=>x.v.mood)).filter(Boolean); return `${s.name} ${avg(m)??'—'}`; });
  const days = R.length, filledDays = R.filter(r=>r.slots.length).length;

  let t = `# Дневник настроения\n`;
  t += `Период: ${a} — ${b} (${days} дн., дней с записями: ${filledDays}, записей: ${all.length})\n`;
  t += `Шкалы: настроение 1–10 (1 — очень плохо, 10 — отлично); сила эмоции 1–10 (1 — едва заметна, 10 — накрывает).\n`;
  t += `Отрезки суток: ${SLOTS.map(s=>`${s.name} ${slotTime(s)}`).join(', ')}. Ночь после полуночи относится к предыдущей дате.\n\n`;
  t += `## Сводка\n`;
  t += `- Среднее настроение: ${avg(moods)??'—'}${moods.length?` (мин ${Math.min(...moods)}, макс ${Math.max(...moods)})`:''}\n`;
  t += `- Среднее по отрезкам: ${bySlot.join('; ')}\n`;
  t += `- Эмоции по частоте: ${top.join(', ') || '—'}\n\n`;
  t += `## По дням\n`;
  for (const r of R){
    if (!r.slots.length){ t += `\n### ${r.date}, ${r.weekday} — нет записей\n`; continue; }
    const dm = avg(r.slots.map(x=>x.v.mood).filter(Boolean));
    t += `\n### ${r.date}, ${r.weekday}${dm!==null?` — среднее ${dm}`:''}\n`;
    for (const {s,v} of r.slots){
      const parts = [];
      parts.push(`настроение ${v.mood?v.mood+'/10':'—'}`);
      parts.push(`эмоция: ${v.emotion||'—'}${v.intensity?` (сила ${v.intensity}/10)`:''}`);
      if ((v.note||'').trim()) parts.push(`заметка: «${v.note.trim().replace(/\s*\n\s*/g,' / ')}»`);
      t += `- ${s.name} ${slotTime(s)}: ${parts.join('; ')}\n`;
    }
  }
  return t;
}
function buildJson(a,b){
  const R = rows(a,b);
  return JSON.stringify({
    format:'mood-diary-v1',
    exported: new Date().toISOString(),
    period:{from:a,to:b},
    scales:{mood:'1-10 (1 очень плохо, 10 отлично)', intensity:'1-10 (1 едва заметна, 10 накрывает)'},
    slots: SLOTS.map(s=>({id:s.id,name:s.name,time:slotTime(s)})),
    entries: R.flatMap(r=>r.slots.map(({s,v})=>({
      date:r.date, weekday:r.weekday, slot:s.name, slot_id:s.id, time:slotTime(s),
      mood:v.mood||null, emotion:v.emotion||null, intensity:v.intensity||null, note:(v.note||'').trim()||null
    })))
  }, null, 2);
}
function current(){ const [a,b]=range(); return {a,b,text: fmt==='txt'?buildTxt(a,b):buildJson(a,b)}; }
function refresh(){
  const {a,b,text} = current();
  const n = rows(a,b).reduce((x,r)=>x+r.slots.length,0);
  document.getElementById('einfo').textContent = `${a} — ${b} · записей: ${n}`;
  document.getElementById('preview').textContent = text;
}
function segs(id, cb){
  document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle('on', x===b)); cb(b); refresh();
  });
}
segs('period', b => { period = b.dataset.p; document.getElementById('dates').classList.toggle('show', period==='custom'); });
segs('fmt', b => { fmt = b.dataset.f; });
['dFrom','dTo'].forEach(id => document.getElementById(id).onchange = refresh);

document.getElementById('expBtn').onclick = () => {
  const t = nowSlot().date;
  document.getElementById('dFrom').value ||= addDays(t,-6);
  document.getElementById('dTo').value ||= t;
  refresh(); dlg.showModal();
};
document.getElementById('closeBtn').onclick = () => dlg.close();
document.getElementById('copyBtn').onclick = async () => {
  const {text} = current();
  try { await navigator.clipboard.writeText(text); toast('Скопировано'); }
  catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById('preview'));
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); toast('Скопировано'); }
};
document.getElementById('saveBtn').onclick = async () => {
  const {a,b,text} = current();
  const name = `mood_${a}_${b}.${fmt==='txt'?'md':'json'}`;
  const file = new File([text], name, {type: fmt==='txt'?'text/markdown':'application/json'});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:name}); return; } catch(e){ if (e.name==='AbortError') return; }
  }
  const url = URL.createObjectURL(file), l = document.createElement('a');
  l.href = url; l.download = name; document.body.appendChild(l); l.click(); l.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
};
document.getElementById('impBtn').onclick = () => document.getElementById('impFile').click();
document.getElementById('impFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try{
    const j = JSON.parse(await f.text());
    if (j.format!=='mood-diary-v1' || !Array.isArray(j.entries)) throw 0;
    let n = 0;
    for (const x of j.entries){
      if (!x.date || !SLOTS.some(s=>s.id===x.slot_id)) continue;
      db[x.date] = db[x.date] || {};
      db[x.date][x.slot_id] = {mood:x.mood, emotion:x.emotion, intensity:x.intensity, note:x.note||'', updated:new Date().toISOString()};
      n++;
    }
    save(); render(); refresh(); toast(`Восстановлено записей: ${n}`);
  }catch(err){ toast('Это не файл экспорта JSON'); }
  e.target.value = '';
};

let tt;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1600); }

document.addEventListener('visibilitychange', () => { if (!document.hidden && document.activeElement.tagName!=='TEXTAREA'){ db = load(); render(); } });
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
